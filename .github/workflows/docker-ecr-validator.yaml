name: Build and Push Validator Image to ECR

on:
  push:
    branches:
      - dev
    paths:
      - services/validation-task/**
      - .github/workflows/docker-ecr-validator.yaml

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.VALIDATOR_ECR_REPOSITORY }} ./services/validator-task

      - name: Tag Docker image
        run: |
          docker tag ${{ secrets.VALIDATOR_ECR_REPOSITORY }}:latest ${{ secrets.VALIDATOR_ECR_REGISTRY }}:latest

      - name: Push Docker image to ECR
        run: |
          docker push ${{ secrets.VALIDATOR_ECR_REGISTRY }}:latest
