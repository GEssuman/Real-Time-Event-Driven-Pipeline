services:

  validator:
    build: 
      context: ./services/validation-task
    env_file:
      - .env
    environment:
      - S3_FILE_PATH=s3://ecommerce-raw.amalitech-gke/orders/orders_part1.csv
      - FILE_TYPE=orders
      - EVENT_TIME=12345679
    networks:
      - etl_network


  spark-master:
    image: bitnami/spark:3.5
    container_name: spark-master
    user: root
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"   # Spark master RPC port
      - "8080:8080"   # Spark master UI
    networks:
      - etl_network

  spark-worker:
    image: bitnami/spark:3.5
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    networks:
      - etl_network

  spark-driver:
    build: 
      context: ./services/transformation-task
    depends_on:
      - spark-master
      - spark-worker
    volumes:
      - ~/.aws:/root/.aws:ro
    env_file:
    - .env
    environment:
      - S3_FILE_PATH=s3://ecommerce-raw.amalitech-gke/order_items/order_items_part1.csv
      - FILE_TYPE=order_items
      - AWS_PROFILE=default
    command: >
      spark-submit --master spark://spark-master:7077 /opt/spark/transform.py
    networks:
      - etl_network


networks:
  etl_network: